<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Wetti Rad Pro - Wettpropheten</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Arial Black', 'Impact', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        /* Das fette, edle 3D-Ergebnis-Display oben in der Mitte */
        #resultDisplay {
            font-size: 4.5rem;
            font-weight: 900;
            color: #000;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border: 4px solid #fff;
            padding: 5px 50px;
            border-radius: 20px;
            margin-bottom: 30px;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.6);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
            z-index: 1000;
        }

        #resultDisplay.show {
            transform: scale(1);
        }

        /* Das diskrete Admin-Eingabefeld oben links in der Ecke */
        .admin-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 9999;
            background: rgba(20, 20, 20, 0.95);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d4af37;
        }

        .admin-panel label {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .admin-panel input {
            background: #000;
            border: 2px solid #d4af37;
            color: #fff;
            padding: 8px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            width: 110px;
            text-align: center;
            outline: none;
        }

        .wheel-container {
            position: relative;
            width: 550px;
            height: 550px;
            perspective: 1200px;
        }

        /* Goldener Zeiger oben */
        .pointer {
            position: absolute;
            top: -25px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 22px solid transparent;
            border-right: 22px solid transparent;
            border-top: 45px solid #d4af37;
            z-index: 10;
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.7));
        }

        /* Das Rad im originalen Wettpropheten-Stil */
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 45px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: repeating-conic-gradient(
                #8b0000 0deg 5deg,
                #006400 5deg 10deg
            );
            border: 14px solid #d4af37;
            z-index: 2;
        }

        .text-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 3;
        }

        /* Fette Balkenschrift aufrecht auf den Speichen ausgerichtet */
        .segment-text {
            position: absolute;
            width: 50%;
            height: 30px;
            top: calc(50% - 15px);
            left: 50%;
            transform-origin: left center;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 25px;
            box-sizing: border-box;
            font-weight: 900;
            font-size: 1.15rem;
            color: #ffffff !important;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
        }

        /* Der goldene Mittelpunkt passend zum Außenrand */
        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(15px);
            width: 130px;
            height: 130px;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border-radius: 50%;
            border: 6px solid #d4af37;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 5;
            pointer-events: none;
        }

        .center-logo img {
            width: 85%;
            height: 85%;
            object-fit: contain;
            border-radius: 50%;
        }

        .spin-btn {
            margin-top: 40px;
            padding: 16px 45px;
            font-size: 1.6rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 999;
            position: relative;
        }

        .spin-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6);
        }
    </style>
</head>
<body>

    <!-- Geheimes Steuerungsfeld oben links -->
    <div class="admin-panel">
        <label for="rigInput">Wunsch-Tipp:</label>
        <input type="text" id="rigInput" placeholder="z.B. 2:1">
    </div>

    <!-- Das fette Ergebnis-Display oberhalb des Rades -->
    <div id="resultDisplay">X:X</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="text-layer" id="textLayer"></div>
            <div class="center-logo">
                <img src="https://githubusercontent.com" alt="Wettpropheten Wappen">
            </div>
        </div>
    </div>

    <button class="spin-btn" onclick="spinWheel()">Rad Drehen</button>

    <script>
        const outcomes = [
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "0:0", "1:1",
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "2:2", "3:3",
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "1:1", "0:2"
        ];
        
        const totalSegments = outcomes.length;
        const degreesPerSegment = 360 / totalSegments; 
        let currentRotation = 0;
        let isSpinning = false;

        // Generiert den Speichen-Text im Kreis
        const textLayer = document.getElementById('textLayer');
        outcomes.forEach((text, i) => {
            const el = document.createElement('div');
            el.className = 'segment-text';
            el.innerText = text;
            // Ausrichtung im Uhrzeigersinn
            el.style.transform = `rotate(${(i * degreesPerSegment) + (degreesPerSegment / 2)}deg)`;
            textLayer.appendChild(el);
        });

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const display = document.getElementById('resultDisplay');
            display.classList.remove('show');

            const inputVal = document.getElementById('rigInput').value.trim();
            let targetDegree = 0;
            let finalOutcome = "";

            if (inputVal && outcomes.includes(inputVal)) {
                // Berechnet das exakte Wunschfeld passend zur Rotationsrichtung
                const targetIndex = outcomes.indexOf(inputVal);
                targetDegree = (360 - (targetIndex * degreesPerSegment) - (degreesPerSegment / 2)) % 360;
                // Mathematischer Fix: Korrektur für die exakte Zeiger-Position oben (90 Grad Versatz im CSS ausgeglichen)
                targetDegree = (targetDegree + 270) % 360;
                finalOutcome = inputVal;
            } else {
                // Reiner Zufall, falls das Feld leer ist
                const randomIndex = Math.floor(Math.random() * totalSegments);
                targetDegree = (360 - (randomIndex * degreesPerSegment) - (degreesPerSegment / 2)) % 360;
                targetDegree = (targetDegree + 270) % 360;
                finalOutcome = outcomes[randomIndex];
            }

            const extraSpins = 2160; // 6 volle Umdrehungen
            currentRotation += extraSpins + (targetDegree - (currentRotation % 360));
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = `rotate(${currentRotation}deg)`;

            setTimeout(() => {
                display.innerText = finalOutcome;
                display.classList.add('show');
                isSpinning = false;
            }, 5000);
        }
    </script>

</body>
</html>
