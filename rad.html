<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Das Wetti Rad Pro - Wettpropheten</title>
    <style>
        body {
            background-color: #0b0b0b;
            color: #fff;
            font-family: 'Arial Black', 'Impact', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            user-select: none;
        }

        #resultDisplay {
            font-size: 4.5rem;
            font-weight: 900;
            color: #000;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border: 4px solid #fff;
            padding: 5px 50px;
            border-radius: 20px;
            margin-bottom: 25px;
            min-width: 180px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.9), 0 0 20px rgba(212, 175, 55, 0.6);
            transform: scale(0);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            letter-spacing: 1px;
            z-index: 1000;
        }

        #resultDisplay.show {
            transform: scale(1);
        }

        .admin-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            flex-direction: column;
            gap: 5px;
            z-index: 9999;
            background: rgba(20, 20, 20, 0.95);
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #d4af37;
        }

        .admin-panel label {
            font-size: 0.75rem;
            color: #d4af37;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
        }

        .admin-panel input {
            background: #000;
            border: 2px solid #d4af37;
            color: #fff;
            padding: 8px 12px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 6px;
            width: 110px;
            text-align: center;
            outline: none;
        }

        .wheel-container {
            position: relative;
            width: 500px;
            height: 500px;
            perspective: 1200px;
            margin-bottom: 35px; /* Erhöhter Abstand für Profi-Look */
        }

        .pointer {
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-top: 40px solid #d4af37;
            z-index: 10;
            filter: drop-shadow(0px 5px 8px rgba(0,0,0,0.7));
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            position: relative;
            box-shadow: 0 20px 45px rgba(0,0,0,0.9), inset 0 0 40px rgba(0,0,0,0.8);
            transform-style: preserve-3d;
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: repeating-conic-gradient(
                #8b0000 0deg 5deg,
                #006400 5deg 10deg
            );
            border: 14px solid #d4af37;
            z-index: 2;
        }

        .text-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 99;
        }

        .wheel-number {
            position: absolute;
            width: 100px; 
            height: 35px;
            top: calc(50% - 17.5px);
            left: calc(50% - 50px);
            transform-origin: center center;
            display: flex !important;
            align-items: center;
            justify-content: flex-end;
            box-sizing: border-box;
            font-weight: 900;
            font-size: 1.1rem;
            color: #ffffff !important;
            text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000, -1px 1px 0px #000;
        }

        .wheel-number-inner {
            width: 100%;
            text-align: right;
            padding-right: 5px; 
            box-sizing: border-box;
        }

        .center-logo {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) translateZ(15px);
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border-radius: 50%;
            border: 6px solid #d4af37;
            box-shadow: 0 6px 20px rgba(0,0,0,0.6);
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* PREMIUM EDEL LOOK: Eleganter Button mit weichem Glüheffekt */
        .spin-btn {
            padding: 15px 60px;
            font-size: 1.5rem;
            font-weight: bold;
            color: #000;
            background: linear-gradient(45deg, #bf953f, #fcf6ba, #b38728, #fbf5b7);
            border: none;
            border-radius: 35px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.3), 0 0 25px rgba(212, 175, 55, 0.2);
            text-transform: uppercase;
            transition: transform 0.2s, box-shadow 0.2s;
            z-index: 999;
            letter-spacing: 1px;
        }

        .spin-btn:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 25px rgba(212, 175, 55, 0.5), 0 0 35px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <label for="rigInput">Wunsch-Tipp:</label>
        <input type="text" id="rigInput" placeholder="z.B. 2:1">
    </div>

    <div id="resultDisplay">X:X</div>

    <div class="wheel-container">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
            <div class="text-layer" id="textLayer"></div>
            <div class="center-logo"></div>
        </div>
    </div>

    <button class="spin-btn" onclick="spinWheel()">Rad Drehen</button>

    <script>
        const outcomes = [
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "0:0", "1:1",
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "2:2", "3:3",
            "1:0", "2:1", "0:0", "1:1", "2:0", "3:1", "1:2", "0:1", "2:2", "1:3", "3:0", "0:2", "4:1", "1:4", "2:3", "3:2", "4:0", "0:3", "5:1", "1:5", "2:4", "4:2", "1:1", "0:2"
        ];
        
        const totalSegments = outcomes.length;
        const degreesPerSegment = 360 / totalSegments; 
        let currentRotation = 0;
        let isSpinning = false;

        const textLayer = document.getElementById('textLayer');
        outcomes.forEach(function(text, i) {
            const el = document.createElement('div');
            el.className = 'wheel-number';
            el.innerHTML = '<div class="wheel-number-inner">' + text + '</div>';
            el.style.transform = 'rotate(' + ((i * degreesPerSegment) + (degreesPerSegment / 2)) + 'deg) translateX(190px)';
            textLayer.appendChild(el);
        });

        function spinWheel() {
            if (isSpinning) return;
            isSpinning = true;

            const display = document.getElementById('resultDisplay');
            display.classList.remove('show');

            const inputVal = document.getElementById('rigInput').value.trim();
            let finalOutcome = "";
            let selectedIndex = 0;

            let matchingIndices = [];
            outcomes.forEach(function(val, idx) {
                if (val === inputVal) matchingIndices.push(idx);
            });

            if (inputVal && matchingIndices.length > 0) {
                finalOutcome = inputVal;
                selectedIndex = matchingIndices[Math.floor(Math.random() * matchingIndices.length)];
            } else {
                selectedIndex = Math.floor(Math.random() * totalSegments);
                finalOutcome = outcomes[selectedIndex];
            }

            // DER UNFEHLBARE 45-GRAD-FIX: Der Versatz von +260 wurde auf exakt +305 Grad angepasst. Zieht das Rad millimetergenau auf die echte Feldmitte!
            let targetDegree = (360 - (selectedIndex * degreesPerSegment) - (degreesPerSegment / 2) + 305) % 360;
            
            const extraSpins = 2160; 
            currentRotation += extraSpins + (targetDegree - (currentRotation % 360));
            
            const wheel = document.getElementById('wheel');
            wheel.style.transform = 'rotate(' + currentRotation + 'deg)';

            setTimeout(function() {
                display.innerText = finalOutcome;
                display.classList.add('show');
                isSpinning = false;
            }, 5000);
        }
    </script>

</body>
</html>
