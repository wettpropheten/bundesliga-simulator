
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Das Wetti Rad Pro - Wettpropheten</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    user-select: none;
}

/* Ergebnisanzeige */

#resultDisplay {
    font-size: 4.5rem;
    font-weight: 900;
    color: #000;
    background: linear-gradient(45deg,#bf953f,#fcf6ba,#b38728,#fbf5b7);
    border: 4px solid white;
    padding: 5px 50px;
    border-radius: 20px;
    margin-bottom: 25px;
    min-width: 180px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.9),
                0 0 20px rgba(212,175,55,.6);
    transform: scale(0);
    transition: transform .5s cubic-bezier(.175,.885,.32,1.275);
    z-index: 1000;
}

#resultDisplay.show {
    transform: scale(1);
}

/* Admin */

.admin-panel {
    position: absolute;
    top: 17px;
    left: 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 9999;
    background: rgba(20,20,20,.95);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d4af37;
}

.admin-panel label {
    font-size: 12px;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
}

.admin-panel input {
    background: #000;
    border: 2px solid #d4af37;
    color: white;
    padding: 8px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 6px;
    width: 120px;
    text-align: center;
    outline: none;
}

/* Sound-Schalter */

.sound-panel {
    position: absolute;
    top: 17px;
    right: 18px;
    z-index: 9999;
}

.sound-btn {
    background: #171717;
    color: #d4af37;
    border: 2px solid #d4af37;
    border-radius: 9px;
    padding: 11px 15px;
    font-weight: bold;
    cursor: pointer;
    font-size: 14px;
}

.sound-btn:hover {
    background: #29200c;
}

/* Glücksrad 30 % größer */

.wheel-container {
    position: relative;
    width: 598px;
    height: 598px;
    margin-bottom: 25px;
    flex-shrink: 0;
}

.pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid #d4af37;
    z-index: 100;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.7));
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    border: 12px solid #d4af37;
    box-shadow:
        0 20px 45px rgba(0,0,0,.9),
        inset 0 0 40px rgba(0,0,0,.8);
    transform: rotate(0deg);
    transition: transform 5s cubic-bezier(.1,.8,.1,1);
    z-index: 2;
}

.text-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border-radius: 50%;
    z-index: 3;
    pointer-events: none;
}

.wheel-number {
    position: absolute;
    width: 90px;
    height: 30px;
    top: calc(50% - 15px);
    left: calc(50% - 45px);
    transform-origin: center center;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    font-weight: 900;
    font-size: 15px;
    color: white;
    text-shadow: 2px 2px 0 black,
                -1px -1px 0 black,
                1px -1px 0 black,
                -1px 1px 0 black;
}

.wheel-number-inner {
    width: 100%;
    text-align: right;
    padding-right: 4px;
}

/* Goldene Mitte */

.center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 143px;
    height: 143px;
    background: linear-gradient(45deg,#bf953f,#fcf6ba,#b38728,#fbf5b7);
    border-radius: 50%;
    border: 6px solid #d4af37;
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
    z-index: 5;
    pointer-events: none;
}

/* Drehbutton */

.spin-btn {
    padding: 14px 55px;
    font-size: 21px;
    font-weight: bold;
    color: black;
    background: linear-gradient(45deg,#bf953f,#fcf6ba,#b38728,#fbf5b7);
    border: none;
    border-radius: 35px;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(212,175,55,.3),
                0 0 25px rgba(212,175,55,.2);
    text-transform: uppercase;
    transition: transform .2s;
    z-index: 999;
    letter-spacing: 1px;
}

.spin-btn:hover {
    transform: scale(1.04);
}

.spin-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* Smartphone */

@media (max-width: 650px) {
    .wheel-container {
        width: 92vw;
        height: 92vw;
        max-width: 598px;
        max-height: 598px;
    }

    #resultDisplay {
        font-size: 3rem;
        padding: 5px 30px;
    }

    .wheel-number {
        font-size: 11px;
        width: 75px;
        left: calc(50% - 37.5px);
    }

    .spin-btn {
        font-size: 17px;
        padding: 13px 40px;
    }

    .admin-panel {
        top: 10px;
        left: 10px;
    }

    .sound-panel {
        top: 10px;
        right: 10px;
    }
}

@media (max-height: 850px) and (min-width: 651px) {
    .wheel-container {
        width: min(598px, 68vh);
        height: min(598px, 68vh);
    }
}
</style>
</head>

<body>

<!-- Wunsch-Tipp -->

<div class="admin-panel">
    <label for="rigInput">Wunsch-Tipp:</label>
    <input
        type="text"
        id="rigInput"
        placeholder="z.B. 2:0"
        autocomplete="off"
    >
</div>

<!-- Sound-Schalter -->

<div class="sound-panel">
    <button class="sound-btn" id="soundButton" onclick="toggleSound()">
        🔊 SOUND AN
    </button>
</div>

<!-- Ergebnis -->

<div id="resultDisplay">X:X</div>

<!-- Glücksrad -->

<div class="wheel-container">
    <div class="pointer"></div>

    <div class="wheel" id="wheel">
        <div class="text-layer" id="textLayer"></div>
        <div class="center-logo"></div>
    </div>
</div>

<button class="spin-btn" id="spinButton" onclick="spinWheel()">
    Rad Drehen
</button>


<script>

// ======================================
// ERGEBNISSE
// ======================================

let outcomes = [
    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "2:2", "3:3",

    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "1:1", "0:2",

    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "1:1", "0:2"
];


// ======================================
// VARIABLEN
// ======================================

const wheel = document.getElementById("wheel");
const textLayer = document.getElementById("textLayer");
const display = document.getElementById("resultDisplay");
const input = document.getElementById("rigInput");
const spinButton = document.getElementById("spinButton");
const soundButton = document.getElementById("soundButton");

let currentRotation = 0;
let isSpinning = false;
let soundEnabled = true;

let audioContext = null;
let tickTimer = null;
let animationFrame = null;


// ======================================
// AUDIO INITIALISIEREN
// ======================================

function initAudio() {

    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
            audioContext = new AudioContextClass();
        }
    }

    if (audioContext && audioContext.state === "suspended") {
        audioContext.resume();
    }
}


// ======================================
// MECHANISCHER RAD-KLICK
// ======================================

function playClick(volume = 0.4, frequency = 1200) {

    if (!soundEnabled || !audioContext) return;

    const now = audioContext.currentTime;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.type = "square";

    oscillator.frequency.setValueAtTime(frequency, now);
    oscillator.frequency.exponentialRampToValueAtTime(
        300,
        now + 0.025
    );

    gain.gain.setValueAtTime(volume, now);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        now + 0.035
    );

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(now);
    oscillator.stop(now + 0.04);
}


// ======================================
// SOUND EIN / AUS
// ======================================

function toggleSound() {

    soundEnabled = !soundEnabled;

    soundButton.textContent = soundEnabled
        ? "🔊 SOUND AN"
        : "🔇 SOUND AUS";

    if (soundEnabled) {
        initAudio();
        playClick(0.3, 1000);
    } else {
        stopWheelSound();
    }
}


// ======================================
// RAD AUFBAUEN
// ======================================

function buildWheel() {

    const total = outcomes.length;
    const degrees = 360 / total;

    textLayer.innerHTML = "";

    const gradientParts = [];

    outcomes.forEach((text, i) => {

        const start = i * degrees;
        const end = (i + 1) * degrees;

        const color = i % 2 === 0
            ? "#8b0000"
            : "#006400";

        gradientParts.push(`${color} ${start}deg ${end}deg`);

        const angle = start + degrees / 2 - 90;

        const el = document.createElement("div");
        el.className = "wheel-number";

        const inner = document.createElement("div");
        inner.className = "wheel-number-inner";
        inner.textContent = text;

        el.appendChild(inner);

        el.style.transform =
            `rotate(${angle}deg) translateX(221px)`;

        textLayer.appendChild(el);

    });

    wheel.style.background =
        `conic-gradient(from 0deg, ${gradientParts.join(",")})`;
}


// ======================================
// WUNSCHERGEBNIS PRÜFEN
// ======================================

function getDesiredOutcome() {

    const value = input.value.trim();

    if (!value) return null;

    if (!/^\d{1,2}:\d{1,2}$/.test(value)) {

        alert("Bitte ein gültiges Ergebnis eingeben, z.B. 2:1.");

        return false;
    }

    return value;
}


// ======================================
// SOUND-ANIMATION
// ======================================

function startWheelSound(duration) {

    stopWheelSound();

    if (!soundEnabled) return;

    const startTime = performance.now();

    const initialInterval = 65;
    const finalInterval = 550;

    let lastClick = 0;

    function soundLoop(now) {

        if (!isSpinning || !soundEnabled) return;

        const progress = Math.min(
            (now - startTime) / duration,
            1
        );

        // Klicks werden während des Abbremsens langsamer.

        const eased = 1 - Math.pow(1 - progress, 2);

        const interval =
            initialInterval +
            (finalInterval - initialInterval) * eased;

        if (now - lastClick >= interval) {

            const volume = 0.28 * (1 - progress * 0.45);

            playClick(
                volume,
                1200 + Math.random() * 350
            );

            lastClick = now;
        }

        if (progress < 1) {
            animationFrame =
                requestAnimationFrame(soundLoop);
        }

    }

    animationFrame = requestAnimationFrame(soundLoop);
}


function stopWheelSound() {

    if (animationFrame !== null) {
        cancelAnimationFrame(animationFrame);
        animationFrame = null;
    }
}


// ======================================
// GLÜCKSRAD DREHEN
// ======================================

function spinWheel() {

    if (isSpinning) return;

    const desiredOutcome = getDesiredOutcome();

    if (desiredOutcome === false) return;

    initAudio();

    isSpinning = true;
    spinButton.disabled = true;

    display.classList.remove("show");

    let selectedIndex;

    // Wunsch-Ergebnis

    if (desiredOutcome !== null) {

        let matchingIndices = [];

        outcomes.forEach((value, index) => {

            if (value === desiredOutcome) {
                matchingIndices.push(index);
            }

        });

        if (matchingIndices.length === 0) {

            outcomes.push(desiredOutcome);

            buildWheel();

            selectedIndex = outcomes.length - 1;

        } else {

            selectedIndex = matchingIndices[
                Math.floor(Math.random() * matchingIndices.length)
            ];

        }

    } else {

        // Zufälliges Ergebnis

        selectedIndex = Math.floor(
            Math.random() * outcomes.length
        );

    }


    // Exakte Winkelberechnung

    const totalSegments = outcomes.length;

    const degreesPerSegment = 360 / totalSegments;

    const fieldCenterAngle =
        (selectedIndex + 0.5) * degreesPerSegment;

    const targetAngle =
        (360 - fieldCenterAngle + 360) % 360;

    const currentAngle =
        ((currentRotation % 360) + 360) % 360;

    const rotationDifference =
        (targetAngle - currentAngle + 360) % 360;

    const extraSpins = 6 * 360;

    currentRotation += extraSpins + rotationDifference;


    // Rad starten

    const duration = 5000;

    wheel.style.transform =
        `rotate(${currentRotation}deg)`;


    // Sound starten

    startWheelSound(duration);


    // Ergebnis anzeigen

    const finalOutcome = outcomes[selectedIndex];

    setTimeout(() => {

        stopWheelSound();

        // Deutlicher Schlussklick

        playClick(0.65, 850);

        display.textContent = finalOutcome;
        display.classList.add("show");

        isSpinning = false;
        spinButton.disabled = false;

    }, duration + 100);

}


// ======================================
// ENTER-TASTE
// ======================================

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        spinWheel();
    }

});


// ======================================
// INITIALISIERUNG
// ======================================

buildWheel();

</script>

</body>
</html>
