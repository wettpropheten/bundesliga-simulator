
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Das Wetti Rad Pro - Wettpropheten</title>

<style>
* {
    box-sizing: border-box;
}

body {
    background: #0b0b0b;
    color: white;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    overflow: hidden;
    user-select: none;
}

/* Ergebnisanzeige */

#resultDisplay {
    font-size: 4.5rem;
    font-weight: 900;
    color: #000;
    background: linear-gradient(
        45deg,
        #bf953f,
        #fcf6ba,
        #b38728,
        #fbf5b7
    );
    border: 4px solid white;
    padding: 5px 50px;
    border-radius: 20px;
    margin-bottom: 25px;
    min-width: 180px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.9),
                0 0 20px rgba(212,175,55,.6);
    transform: scale(0);
    transition: transform .5s cubic-bezier(.175,.885,.32,1.275);
    z-index: 1000;
}

#resultDisplay.show {
    transform: scale(1);
}

/* Wunsch-Tipp */

.admin-panel {
    position: absolute;
    top: 17px;
    left: 18px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    z-index: 9999;
    background: rgba(20,20,20,.95);
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #d4af37;
}

.admin-panel label {
    font-size: 12px;
    color: #d4af37;
    text-transform: uppercase;
    letter-spacing: 1px;
    font-weight: bold;
}

.admin-panel input {
    background: #000;
    border: 2px solid #d4af37;
    color: white;
    padding: 8px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 6px;
    width: 120px;
    text-align: center;
    outline: none;
}

/* Glücksrad - 15 % GRÖSSER */

.wheel-container {
    position: relative;
    width: 529px;
    height: 529px;
    margin-bottom: 25px;
    flex-shrink: 0;
}

.pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 20px solid transparent;
    border-right: 20px solid transparent;
    border-top: 40px solid #d4af37;
    z-index: 100;
    filter: drop-shadow(0 5px 8px rgba(0,0,0,.7));
}

.wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    position: relative;
    border: 12px solid #d4af37;
    box-shadow:
        0 20px 45px rgba(0,0,0,.9),
        inset 0 0 40px rgba(0,0,0,.8);

    transform: rotate(0deg);
    transition: transform 5s cubic-bezier(.1,.8,.1,1);
    z-index: 2;
}

.text-layer {
    position: absolute;
    width: 100%;
    height: 100%;
    top: 0;
    left: 0;
    border-radius: 50%;
    z-index: 3;
    pointer-events: none;
}

.wheel-number {
    position: absolute;
    width: 90px;
    height: 30px;
    top: calc(50% - 15px);
    left: calc(50% - 45px);

    transform-origin: center center;

    display: flex;
    align-items: center;
    justify-content: flex-end;

    font-weight: 900;
    font-size: 15px;
    color: white;

    text-shadow:
        2px 2px 0 black,
        -1px -1px 0 black,
        1px -1px 0 black,
        -1px 1px 0 black;
}

.wheel-number-inner {
    width: 100%;
    text-align: right;
    padding-right: 4px;
}

/* Goldene Mitte */

.center-logo {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 127px;
    height: 127px;

    background: linear-gradient(
        45deg,
        #bf953f,
        #fcf6ba,
        #b38728,
        #fbf5b7
    );

    border-radius: 50%;
    border: 6px solid #d4af37;
    box-shadow: 0 6px 20px rgba(0,0,0,.6);
    z-index: 5;
    pointer-events: none;
}

/* Drehbutton */

.spin-btn {
    padding: 14px 55px;
    font-size: 21px;
    font-weight: bold;
    color: black;

    background: linear-gradient(
        45deg,
        #bf953f,
        #fcf6ba,
        #b38728,
        #fbf5b7
    );

    border: none;
    border-radius: 35px;
    cursor: pointer;

    box-shadow:
        0 5px 15px rgba(212,175,55,.3),
        0 0 25px rgba(212,175,55,.2);

    text-transform: uppercase;
    transition: transform .2s;
    z-index: 999;
    letter-spacing: 1px;
}

.spin-btn:hover {
    transform: scale(1.04);
}

.spin-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* Smartphone */

@media (max-width: 600px) {

    .wheel-container {
        width: 92vw;
        height: 92vw;
        max-width: 529px;
        max-height: 529px;
    }

    #resultDisplay {
        font-size: 3rem;
        padding: 5px 30px;
    }

    .wheel-number {
        font-size: 11px;
        width: 75px;
        left: calc(50% - 37.5px);
    }

    .spin-btn {
        font-size: 17px;
        padding: 13px 40px;
    }
}
</style>
</head>

<body>

<!-- Wunsch-Tipp -->

<div class="admin-panel">
    <label for="rigInput">Wunsch-Tipp:</label>

    <input
        type="text"
        id="rigInput"
        placeholder="z.B. 2:0"
        autocomplete="off"
    >
</div>

<!-- Ergebnisanzeige -->

<div id="resultDisplay">X:X</div>

<!-- Glücksrad -->

<div class="wheel-container">

    <div class="pointer"></div>

    <div class="wheel" id="wheel">

        <div class="text-layer" id="textLayer"></div>

        <div class="center-logo"></div>

    </div>

</div>

<button class="spin-btn" id="spinButton" onclick="spinWheel()">
    Rad Drehen
</button>


<script>

// ======================================
// ERGEBNISSE
// ======================================

let outcomes = [
    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "2:2", "3:3",

    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "1:1", "0:2",

    "1:0", "2:1", "0:0", "1:1",
    "2:0", "3:1", "1:2", "0:1",
    "2:2", "1:3", "3:0", "0:2",
    "4:1", "1:4", "2:3", "3:2",
    "4:0", "0:3", "5:1", "1:5",
    "2:4", "4:2", "1:1", "0:2"
];


// ======================================
// VARIABLEN
// ======================================

const wheel = document.getElementById("wheel");
const textLayer = document.getElementById("textLayer");
const display = document.getElementById("resultDisplay");
const input = document.getElementById("rigInput");
const spinButton = document.getElementById("spinButton");

let currentRotation = 0;
let isSpinning = false;


// ======================================
// RAD AUFBAUEN
// ======================================

function buildWheel() {

    const total = outcomes.length;
    const degrees = 360 / total;

    textLayer.innerHTML = "";

    const gradientParts = [];

    outcomes.forEach((text, i) => {

        const start = i * degrees;
        const end = (i + 1) * degrees;

        const color = i % 2 === 0
            ? "#8b0000"
            : "#006400";

        gradientParts.push(
            `${color} ${start}deg ${end}deg`
        );

        const angle = start + degrees / 2 - 90;

        const el = document.createElement("div");
        el.className = "wheel-number";

        const inner = document.createElement("div");
        inner.className = "wheel-number-inner";
        inner.textContent = text;

        el.appendChild(inner);

        // Zahlenposition um 15 % angepasst

        el.style.transform =
            `rotate(${angle}deg) translateX(196px)`;

        textLayer.appendChild(el);

    });

    wheel.style.background =
        `conic-gradient(from 0deg, ${gradientParts.join(",")})`;
}


// ======================================
// WUNSCHERGEBNIS PRÜFEN
// ======================================

function getDesiredOutcome() {

    const value = input.value.trim();

    if (!value) {
        return null;
    }

    if (!/^\d{1,2}:\d{1,2}$/.test(value)) {

        alert("Bitte ein gültiges Ergebnis eingeben, z.B. 2:1.");

        return false;
    }

    return value;
}


// ======================================
// GLÜCKSRAD DREHEN
// ======================================

function spinWheel() {

    if (isSpinning) return;

    const desiredOutcome = getDesiredOutcome();

    if (desiredOutcome === false) return;

    isSpinning = true;
    spinButton.disabled = true;

    display.classList.remove("show");

    let selectedIndex;

    // WUNSCHERGEBNIS

    if (desiredOutcome !== null) {

        let matchingIndices = [];

        outcomes.forEach((value, index) => {

            if (value === desiredOutcome) {
                matchingIndices.push(index);
            }

        });

        if (matchingIndices.length === 0) {

            outcomes.push(desiredOutcome);

            buildWheel();

            selectedIndex = outcomes.length - 1;

        } else {

            selectedIndex = matchingIndices[
                Math.floor(Math.random() * matchingIndices.length)
            ];

        }

    }

    // ZUFALLSERGEBNIS

    else {

        selectedIndex = Math.floor(
            Math.random() * outcomes.length
        );

    }


    // EXAKTE WINKELBERECHNUNG

    const totalSegments = outcomes.length;

    const degreesPerSegment = 360 / totalSegments;

    const fieldCenterAngle =
        (selectedIndex + 0.5) * degreesPerSegment;

    const targetAngle =
        (360 - fieldCenterAngle + 360) % 360;

    const currentAngle =
        ((currentRotation % 360) + 360) % 360;

    let rotationDifference =
        (targetAngle - currentAngle + 360) % 360;

    const extraSpins = 6 * 360;

    currentRotation += extraSpins + rotationDifference;


    // RAD STARTEN

    wheel.style.transform =
        `rotate(${currentRotation}deg)`;


    // ERGEBNIS ANZEIGEN

    const finalOutcome = outcomes[selectedIndex];

    setTimeout(() => {

        display.textContent = finalOutcome;

        display.classList.add("show");

        isSpinning = false;
        spinButton.disabled = false;

    }, 5100);

}


// ======================================
// ENTER-TASTE
// ======================================

input.addEventListener("keydown", function(event) {

    if (event.key === "Enter") {
        spinWheel();
    }

});


// ======================================
// INITIALISIERUNG
// ======================================

buildWheel();

</script>

</body>
</html>
